<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculus-Based Physics Quiz: Energy, Work, and Power</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #333; max-width: 800px; margin: 0 auto; padding: 20px; background-color: #f4f7f6; }
        h1 { color: #2c3e50; text-align: center; border-bottom: 2px solid #2c3e50; padding-bottom: 10px; }
        .question { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .question p { font-weight: bold; margin-bottom: 15px; }
        .options { list-style-type: none; padding: 0; }
        .options li { margin-bottom: 10px; padding: 10px; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; transition: background 0.3s; }
        .options li:hover { background-color: #e9ecef; }
        .correct { background-color: #d4edda !important; border-color: #c3e6cb !important; }
        .incorrect { background-color: #f8d7da !important; border-color: #f5c6cb !important; }
        button { display: block; width: 100%; padding: 15px; background-color: #2c3e50; color: white; border: none; border-radius: 8px; font-size: 1.1rem; cursor: pointer; margin-top: 20px; }
        button:hover { background-color: #34495e; }
        #results { margin-top: 30px; text-align: center; font-size: 1.5rem; display: none; }
    </style>
</head>
<body>

    <h1>Energy, Work, and Power Quiz</h1>

    <div id="quiz-container">
        </div>

    <button onclick="calculateScore()">Submit Quiz</button>
    <div id="results"></div>

    <script>
        const quizData = [
            {
                q: "A force \\( F(x) = 3x^2 - 2x + 5 \\) (in Newtons) acts on a particle. What is the work done by this force as the particle moves from \\( x = 0 \\) to \\( x = 2 \\) meters?",
                options: ["10 J", "12 J", "14 J", "16 J"],
                answer: 2 // 14 J
            },
            {
                q: "The potential energy function for a conservative force is given by \\( U(x) = ax^2 - bx \\). What is the expression for the associated force \\( F(x) \\)?",
                options: ["\\( 2ax - b \\)", "\\( -2ax + b \\)", "\\( ax - b \\)", "\\( -ax + b \\)"],
                answer: 1
            },
            {
                q: "An object's velocity is given by \\( v(t) = 4t^3 \\). If the mass is 2 kg, what is the instantaneous power delivered to the object at \\( t = 1 \\) s?",
                options: ["24 W", "48 W", "96 W", "192 W"],
                answer: 2 // P = Fv = (ma)v = (2 * 12t^2) * 4t^3 = 96t^5
            },
            {
                q: "The work-energy theorem states that the work done by the net force on a particle is equal to the change in its kinetic energy. In integral form, this is expressed as:",
                options: ["\\( \\int F \\cdot dr = \\Delta K \\)", "\\( \\int F \\cdot dt = \\Delta p \\)", "\\( \\int P \\cdot dt = \\Delta U \\)", "\\( \\nabla \\times F = 0 \\)"],
                answer: 0
            },
            {
                q: "A varying power \\( P(t) = 10t \\) is applied to a machine. How much work is done between \\( t = 0 \\) and \\( t = 4 \\) seconds?",
                options: ["40 J", "80 J", "160 J", "20 J"],
                answer: 1 // Integral of 10t from 0 to 4 is 5t^2 = 5(16) = 80
            },
            {
                q: "If a force field is defined by \\( \\vec{F} = y \\hat{i} + x \\hat{j} \\), is the work done along a path dependent on the path taken?",
                options: ["Yes, because the curl is non-zero.", "No, because the force is conservative.", "Yes, because it is a velocity-dependent force.", "No, because it is a friction force."],
                answer: 1
            },
            {
                q: "A mass \\( m \\) is attached to a non-linear spring where the force is \\( F(x) = -kx^3 \\). The work required to stretch it from \\( x=0 \\) to \\( x=L \\) is:",
                options: ["\\( \\frac{1}{2}kL^2 \\)", "\\( \\frac{1}{3}kL^3 \\)", "\\( \\frac{1}{4}kL^4 \\)", "\\( kL^4 \\)"],
                answer: 2
            },
            {
                q: "The power required to accelerate a car of mass \\( m \\) such that its velocity increases as \\( v(t) = kt \\) is proportional to:",
                options: ["\\( t \\)", "\\( t^2 \\)", "\\( \sqrt{t} \\)", "Constant"],
                answer: 0 // P = Fv = (mk)(kt) = mk^2 t
            },
            {
                q: "At a point of stable equilibrium in a potential energy curve \\( U(x) \\), which of the following is true?",
                options: ["\\( dU/dx = 0 \\) and \\( d^2U/dx^2 > 0 \\)", "\\( dU/dx = 0 \\) and \\( d^2U/dx^2 < 0 \\)", "\\( dU/dx > 0 \\)", "\\( d^2U/dx^2 = 0 \\)"],
                answer: 0
            },
            {
                q: "A 1 kg object moves in one dimension such that its position is \\( x(t) = t^3 \\). Find the work done by the net force from \\( t=0 \\) to \\( t=1 \\).",
                options: ["3.0 J", "4.5 J", "9.0 J", "1.5 J"],
                answer: 1 // v = 3t^2. At t=0, v=0. At t=1, v=3. Delta K = 1/2(1)(3^2 - 0) = 4.5
            }
        ];

        function loadQuiz() {
            const container = document.getElementById('quiz-container');
            quizData.forEach((item, index) => {
                const qDiv = document.createElement('div');
                qDiv.className = 'question';
                qDiv.innerHTML = `<p>${index + 1}. ${item.q}</p>
                    <ul class="options" id="q${index}">
                        ${item.options.map((opt, i) => `<li onclick="selectOption(${index}, ${i})">${opt}</li>`).join('')}
                    </ul>`;
                container.appendChild(qDiv);
            });
        }

        let userAnswers = new Array(quizData.length).fill(null);

        window.selectOption = function(qIndex, oIndex) {
            userAnswers[qIndex] = oIndex;
            const options = document.querySelectorAll(`#q${qIndex} li`);
            options.forEach((li, i) => {
                li.style.backgroundColor = (i === oIndex) ? "#d1ecf1" : "white";
            });
        }

        window.calculateScore = function() {
            let score = 0;
            quizData.forEach((item, index) => {
                const options = document.querySelectorAll(`#q${index} li`);
                if (userAnswers[index] === item.answer) {
                    score++;
                    options[userAnswers[index]].classList.add('correct');
                } else if (userAnswers[index] !== null) {
                    options[userAnswers[index]].classList.add('incorrect');
                    options[item.answer].classList.add('correct');
                }
            });
            const results = document.getElementById('results');
            results.style.display = 'block';
            results.innerHTML = `Your Score: ${score} / ${quizData.length}`;
            window.scrollTo(0, document.body.scrollHeight);
        }

        loadQuiz();
    </script>
</body>
</html>
